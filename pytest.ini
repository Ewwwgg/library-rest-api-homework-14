[pytest]
DJANGO_SETTINGS_MODULE = library_project.settings
python_files = tests.py test_*.py *_tests.py
testpaths = library/tests
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    django_db: tests require database access
    models: model business logic tests
    books: book catalog and filter tests
    borrowings: borrowing tests
    auth: registration and token tests
